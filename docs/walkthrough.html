<style>
  /* Layout: one 16:9 "screen" at a time, like the phone deck itself: glass panels over a
     deep wallpaper, text column + visual column, transport controls docked underneath. */
  :root {
    color-scheme: dark;
    --night: #070a14;          /* wallpaper base */
    --ink: #eef1f8;
    --ink-2: #b4bccd;
    --ink-3: #7c869c;
    --glass: rgba(255,255,255,.07);
    --edge: rgba(255,255,255,.14);
    --signal: #4fd18b;         /* the deck's "connected" green */
    --tint: #7aa7ff;           /* link blue */
    --amber: #ffb547;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font: 16px/1.5 var(--body);
    background:
      radial-gradient(90% 70% at 0% 0%, rgba(31,79,143,.55), transparent 60%),
      radial-gradient(70% 60% at 100% 20%, rgba(15,107,107,.45), transparent 55%),
      radial-gradient(90% 70% at 85% 100%, rgba(91,42,134,.5), transparent 60%),
      radial-gradient(70% 50% at 10% 100%, rgba(138,59,75,.35), transparent 55%),
      var(--night);
    background-attachment: fixed;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 18px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .glass {
    background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 .5px var(--edge), 0 30px 60px -30px rgba(0,0,0,.8);
  }
  .top { width: min(1180px, 100%); display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 15px var(--display); letter-spacing: -.01em; }
  .brand i { width: 26px; height: 26px; border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 4px; background: #11151f; box-shadow: inset 0 0 0 .5px var(--edge); }
  .brand i b { border-radius: 2px; }
  .chap { margin-left: auto; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); text-align: right; }

  .stage { width: min(1180px, 100%); border-radius: 30px; padding: clamp(20px, 3.4vw, 44px); min-height: min(640px, 72vh);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(20px, 3vw, 44px); align-items: center; }
  .stage.solo { grid-template-columns: minmax(0, 1fr); }
  .txt { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--signal); }
  h1 { margin: 0; font: 800 clamp(30px, 4.6vw, 58px)/1.02 var(--display); letter-spacing: -.035em; text-wrap: balance; }
  h2 { margin: 0; font: 700 clamp(24px, 3.2vw, 38px)/1.08 var(--display); letter-spacing: -.025em; text-wrap: balance; }
  .say { margin: 0; color: var(--ink-2); font-size: clamp(15px, 1.35vw, 17.5px); max-width: 62ch; }
  ul.pts { margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  ul.pts li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
  ul.pts li::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--signal); transform: translateY(-2px); box-shadow: 0 0 8px var(--signal); }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 .5px var(--edge); font-size: 15px; }
  ol.steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font: 700 14px var(--display); background: rgba(79,209,139,.16); color: var(--signal); }
  ol.steps b { color: var(--ink); font-weight: 600; }
  ol.steps small { display: block; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
  code, .k { font: 500 .88em var(--mono); background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 6px; color: #dfe6ff; overflow-wrap: anywhere; }
  .vis { min-width: 0; display: flex; justify-content: center; }
  .shot { width: 100%; border-radius: 18px; display: block; box-shadow: 0 24px 50px -20px rgba(0,0,0,.8), 0 0 0 .5px var(--edge); }
  .shot.tall { width: auto; max-height: min(560px, 62vh); max-width: 100%; }
  .diagram { width: 100%; overflow-x: auto; }
  .diagram svg { width: 100%; min-width: 520px; height: auto; display: block; }
  .note { font-size: 13px; color: var(--ink-3); border-left: 2px solid var(--amber); padding-left: 10px; }
  .note b { color: var(--amber); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; }
  .card { border-radius: 18px; padding: 16px 18px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 .5px var(--edge); }
  .card h3 { margin: 0 0 6px; font: 700 17px var(--display); }
  .card p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .tag { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

  /* hero visual: a tiny live deck */
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(380px, 100%); padding: 18px; border-radius: 34px; background: #04060c; box-shadow: inset 0 0 0 .5px var(--edge), 0 40px 80px -30px rgba(0,0,0,.9); }
  .mini .pill { grid-column: 1 / -1; justify-self: center; width: 46%; height: 30px; border-radius: 15px; background: #000; box-shadow: 0 0 0 .5px rgba(255,255,255,.12); display: flex; align-items: center; gap: 8px; padding: 0 8px; }
  .mini .pill span { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #c55aa8, #6db7c9); }
  .mini .pill em { margin-left: auto; display: flex; gap: 2px; }
  .mini .pill em i { width: 3px; height: 13px; border-radius: 2px; background: #e98fd0; animation: eq 1s ease-in-out infinite; transform-origin: center; }
  .mini .pill em i:nth-child(2) { animation-duration: .8s; } .mini .pill em i:nth-child(3) { animation-duration: 1.2s; }
  @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
  .tile { aspect-ratio: .86; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 11.5px var(--body); color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 .5px rgba(255,255,255,.14); transition: transform .4s cubic-bezier(.2,.9,.25,1); }
  .tile .g { font-size: 26px; line-height: 1; }
  .tile.press { transform: scale(.92); transition-duration: .09s; }

  /* transport */
  .bar { width: min(1180px, 100%); border-radius: 22px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn { height: 42px; min-width: 42px; padding: 0 14px; border-radius: 21px; border: 0; cursor: pointer; color: var(--ink); background: rgba(255,255,255,.09);
    font: 600 14px var(--body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .35s cubic-bezier(.2,.9,.25,1), background .2s; }
  .btn:hover { background: rgba(255,255,255,.15); }
  .btn:active { transform: scale(.92); transition-duration: .08s; }
  .btn:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  .btn.play { background: var(--signal); color: #04210f; min-width: 112px; }
  .btn svg { width: 18px; height: 18px; }
  .prog { flex: 1; min-width: 140px; display: flex; gap: 4px; align-items: center; }
  .prog button { flex: 1; height: 6px; border: 0; padding: 0; border-radius: 3px; background: rgba(255,255,255,.16); cursor: pointer; transition: background .3s; }
  .prog button.done { background: rgba(79,209,139,.55); }
  .prog button.on { background: var(--signal); height: 8px; }
  .count { font: 500 13px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
  .nospeech { width: min(1180px, 100%); font-size: 13px; color: var(--amber); }
  .stage > * { animation: rise .5s cubic-bezier(.2,.9,.25,1) both; }
  .stage > .vis { animation-delay: .06s; }
  @keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (max-width: 820px) {
    .stage { grid-template-columns: minmax(0, 1fr); min-height: 0; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .btn.play { min-width: 92px; }
    .chap { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage > *, .mini .pill em i { animation: none; }
    .tile, .btn { transition: none; }
  }
</style>

  const S = [
    { chap: "Introduction", type: "hero",
      title: "Your phone, as a Stream Deck for your laptop",
      say: "USB Deck turns a phone you already own into a button panel for your Windows laptop. Tap a tile, and the laptop opens an app, jumps to a folder, mutes you in Teams, or skips a song.",
      speak: "Welcome to USB Deck. It turns a phone you already own into a button panel for your Windows laptop. Tap a tile, and the laptop opens an app, jumps to a folder, mutes you in Teams, or skips a song. This walkthrough covers what it does, how it connects, and how to set it up on Android and on iPhone." },
    { chap: "What it does", type: "cards",
      title: "One tap, and the laptop does the work",
      say: "Every tile is an action that runs on the laptop. The phone only draws the buttons.",
      cards: [

    { chap: "How it connects", type: "diagram", iphone: false,

    { chap: "How it connects", type: "diagram", iphone: true,

      speak: "On iPhone the design is even stricter. The app listens on its own loopback address, and Apple's USB tunnel, the same one iTunes uses, is the only thing that can reach it. Unplug the cable and the deck goes dim. The laptop needs Apple's mobile device service, which comes with iTunes or the Apple Devices app." },

  const $ = id => document.getElementById(id);
  const hasSpeech = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  let i = 0, playing = false, utter = null, timer = null;
  try { const n = parseInt(localStorage.getItem("usbdeck.wt"), 10); if (n >= 0 && n < S.length) i = n; } catch (e) {}

  const prog = $("prog");
  S.forEach((s, k) => { const b = document.createElement("button"); b.setAttribute("aria-label", "Slide " + (k + 1) + ": " + s.title); b.onclick = () => go(k, true); prog.appendChild(b); });

  function miniDeck() {
    const t = [["🎙️", "Mute", "#c0392b"], ["📹", "Camera", "#8e44ad"], ["🖥️", "Share", "#2471a3"], ["📁", "Projects", "#117a65"], ["✉️", "Outlook", "#0f6cbd"], ["⏯️", "Play", "#1a5276"]];
    return `<div class="mini" aria-hidden="true"><div class="pill"><span></span><em><i></i><i></i><i></i></em></div>` +
      t.map(([g, l, c]) => `<div class="tile" style="background:color-mix(in srgb, ${c} 62%, transparent)"><span class="g">${g}</span>${l}</div>`).join("") + `</div>`;
  }

  function render() {
    const s = S[i], st = $("stage");
    st.className = "stage glass" + (s.type === "cards" && !s.img ? "" : "");
    let vis = "";
    if (s.type === "hero") vis = miniDeck();
    else if (s.type === "image") vis = `<img class="shot${s.tall ? " tall" : ""}" src="${IMG[s.img]}" alt="${s.title}">`;
    else if (s.type === "diagram") vis = flow(s.iphone);
    else if (s.type === "steps") vis = `<ol class="steps">${s.steps.map(([a, b]) => `<li><div><b>${a}</b><small>${b}</small></div></li>`).join("")}</ol>`;
    else if (s.type === "cards") vis = `<div class="grid2">${s.cards.map(([h, p]) => `<div class="card"><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>`;
    const H = s.type === "hero" ? "h1" : "h2";
    st.innerHTML = `<div class="txt"><div class="eyebrow">${s.chap}</div><${H}>${s.title}</${H}><p class="say">${s.say}</p>` +
      (s.pts ? `<ul class="pts">${s.pts.map(p => `<li>${p}</li>`).join("")}</ul>` : "") +
      (s.note ? `<p class="note">${s.note}</p>` : "") + `</div><div class="vis">${vis}</div>`;
    $("chap").textContent = s.chap;
    $("count").textContent = `${i + 1} / ${S.length}`;
    [...prog.children].forEach((b, k) => { b.classList.toggle("on", k === i); b.classList.toggle("done", k < i); });
    try { localStorage.setItem("usbdeck.wt", String(i)); } catch (e) {}
    if (s.type === "hero") animateMini();
  }

  let miniT;
  function animateMini() {
    clearInterval(miniT);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let n = 0;
    miniT = setInterval(() => {
      const tiles = document.querySelectorAll(".mini .tile"); if (!tiles.length) return clearInterval(miniT);
      const t = tiles[n++ % tiles.length]; t.classList.add("press"); setTimeout(() => t.classList.remove("press"), 140);
    }, 900);
  }

  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    return vs.find(v => /en-(GB|US|IN)/i.test(v.lang) && /natural|neural|online/i.test(v.name)) ||
           vs.find(v => /^en/i.test(v.lang) && /google|microsoft/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  function speak() {
    if (!hasSpeech) return;
    speechSynthesis.cancel(); clearTimeout(timer);
    const u = new SpeechSynthesisUtterance(S[i].speak || S[i].say);
    const v = pickVoice(); if (v) u.voice = v;
    u.rate = 1.0; u.pitch = 1.0;
    u.onend = () => { if (utter !== u || !playing) return; if (i < S.length - 1) timer = setTimeout(() => { go(i + 1); speak(); }, 650); else setPlaying(false); };
    utter = u; speechSynthesis.speak(u);
  }
  function setPlaying(p) {
    playing = p;
    $("playTxt").textContent = p ? "Pause" : "Play";
    $("icPlay").innerHTML = p ? '<rect x="6" y="4.5" width="4.2" height="15" rx="1.3"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.3"/>'
                              : '<path d="M7 4.9v14.2a1 1 0 0 0 1.5.86l11.6-7.1a1 1 0 0 0 0-1.72L8.5 4.04A1 1 0 0 0 7 4.9z"/>';
    if (!p && hasSpeech) { utter = null; speechSynthesis.cancel(); clearTimeout(timer); }
  }
  function go(k, manual) {
    i = Math.max(0, Math.min(S.length - 1, k)); render();
    if (manual && playing) speak();                         // manual nav while playing: narrate the new slide
    else if (manual && hasSpeech) { utter = null; speechSynthesis.cancel(); }
  }
  $("play").onclick = () => { if (!hasSpeech) return; if (playing) setPlaying(false); else { setPlaying(true); speak(); } };
  $("next").onclick = () => go(i + 1, true);
  $("prev").onclick = () => go(i - 1, true);
  $("restart").onclick = () => go(0, true);
  addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
    if (e.key === "ArrowRight") go(i + 1, true); else if (e.key === "ArrowLeft") go(i - 1, true);
    else if (e.key === " ") { e.preventDefault(); $("play").click(); }
  });
  if (!hasSpeech) { $("play").disabled = true; $("play").style.opacity = .4; $("nospeech").hidden = false; }
  else if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => {};
  render();
})();
</script>
